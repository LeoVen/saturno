[package]
name = "solver"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# Only to assert the exact wire shape of a few Serialize types in tests
# (E09: caught a real bug this way — see model.rs's Violation test) — never
# used outside #[cfg(test)], so it doesn't affect the release wasm build.
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
